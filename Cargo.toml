[workspace]
members = ["crates/chat-core", "crates/desktop", "crates/yandex-proto"]
resolver = "2"

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"

[profile.dev]
debug = 0

[profile.release]
lto = "thin"
codegen-units = 8

[patch.crates-io]
block = { path = "vendor/block" }
proc-macro-error2 = { path = "vendor/proc-macro-error2" }
xattr = { path = "vendor/xattr" }
