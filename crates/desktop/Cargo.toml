[package]
name = "blazing-telesram"
version.workspace = true
edition.workspace = true
license = "MIT AND Apache-2.0"

[dependencies]
bt-chat-core = { path = "../chat-core" }
# Compile Metal shaders at runtime: building them ahead of time needs full Xcode.
gpui = { version = "=0.2.2", features = ["runtime_shaders"] }
unicode-segmentation = "1.12"
yandex-proto = { path = "../yandex-proto" }
