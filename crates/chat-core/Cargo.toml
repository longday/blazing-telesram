[package]
name = "bt-chat-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
async-channel = "=2.5.0"
rusqlite = { version = "=0.43.0", features = ["bundled"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
thiserror = "=2.0.21"
# `net`: backends do network I/O on the client runtime.
tokio = { version = "=1.54.1", features = ["rt", "time", "sync", "net"] }
tracing = "=0.1.44"
uuid = { version = "=1.29.3", features = ["v4"] }

[dev-dependencies]
tempfile = "=3.27.0"
# `test-util`: engine tests run under a paused clock.
# `io-util`: the socket test reads and writes the echo server with `read_exact`/`write_all`.
tokio = { version = "=1.54.1", features = ["macros", "test-util", "io-util"] }
