[package]
name = "bt-chat-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
async-channel = "=2.5.0"
rusqlite = { version = "=0.43.0", features = ["bundled"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
thiserror = "=2.0.21"
tokio = { version = "=1.54.1", features = ["rt", "time", "sync"] }

[dev-dependencies]
tempfile = "=3.27.0"
