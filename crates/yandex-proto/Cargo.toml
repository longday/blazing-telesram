[package]
name = "yandex-proto"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
futures = "=0.3.34"
reqwest = { version = "=0.13.5", default-features = false, features = ["native-tls", "http2", "multipart"] }
rmpv = "=1.3.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
thiserror = "=2.0.21"
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "fs"] }
tokio-tungstenite = { version = "=0.30.0", features = ["native-tls", "connect"] }
uuid = { version = "=1.29.3", features = ["v4"] }

[dev-dependencies]
tempfile = "=3.27.0"
tokio = { version = "=1.54.1", features = ["test-util"] }
